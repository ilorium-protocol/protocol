#
# Developer Certificate of Origin. Every commit in the pull request carries
# `Signed-off-by:`. An agent commit (author name contains "(AI)" and email
# ends with @ilorium.com, or the pull request is labeled `agent-authored`)
# must carry a sign-off by someone other than its author
# (governance-v1.md, section 7; CONTRIBUTING.md, "Agents").
# Status check context: "dco".
name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AGENT: ${{ contains(github.event.pull_request.labels.*.name, 'agent-authored') && '--agent-authored' || '' }}
        run: python3 -I tools/check_dco.py "$BASE" "$HEAD" $AGENT

#
# Continuous checks on every pull request and every push to main.
# Jobs are named so that their status check contexts are exactly
# "ci / docs" and "ci / verifier", as required by the `main` ruleset
# (org/rulesets/main-protection.json in the deployment kit).
#
# Bots only read here. Nothing in this workflow writes to the repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Markdown checks (UTF-8, no tabs, final newline, .es.md counterparts)
        run: python3 -I tools/check_docs.py .

      - name: Schemas are strict JSON and valid JSON Schema (skips with a notice when schemas/ is empty)
        run: |
          if find schemas -name '*.json' -type f | grep -q .; then
            python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.26.0
          else
            echo "::notice title=schemas::schemas/ has no JSON files yet; populated from the M0 archive before the first release. Check skipped."
          fi
          python3 -I tools/check_schemas.py schemas

      - name: vectors/index.json matches the vector files (SHA-256, case counts)
        run: python3 -I tools/vectors_index.py --check

  verifier:
    name: ci / verifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the verifier
        id: detect
        run: |
          if [ -f verifier/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=verifier::verifier/pyproject.toml is absent; the verifier is populated from the M0 archive before the first release. Tests and vectors run skipped."
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the verifier with its test dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest==9.1.1
          python3 -m pip install --disable-pip-version-check --quiet -e "./verifier[dev]"

      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        run: python3 -m pytest verifier -q

      - name: Run the conformity vectors (384 cases; ML-DSA-44 cases report UNKNOWN where OpenSSL < 3.5)
        if: steps.detect.outputs.present == 'true'
        env:
          ILORIUM_SCHEMAS: schemas
        run: ilorium-verifier conformity vectors

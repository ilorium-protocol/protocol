# Copyright The Ilorium Authors
#
# Protocol release. Runs only when a tag `protocol/*` is pushed.
#
# Who can push such a tag: only organization admins (org ruleset
# `tags-protocol`, which also requires the tag to be signed). During interim
# governance that is the founder alone (governance-v1.md, section 8). The job
# also needs the `release` environment, whose protection rule requires the
# founder's approval before any step runs. No bot can trigger this.
#
# Tag signature: GitHub enforces the signature on push through the ruleset;
# this workflow cannot verify it again without the signer's public keys, so it
# records the tag object's signature status with `git tag -v` as a notice only.
#
# What it builds: vectors/index.json (SHA-256 of every vector), the verifier's
# sdist and wheel, a CycloneDX SBOM, cosign keyless signatures (Sigstore) of
# every artifact, and a build provenance attestation. Then a GitHub Release
# marked prerelease, because the protocol is draft.
#
# If the verifier is absent at tag time, the workflow fails on purpose rather
# than publish an empty release.
name: release

on:
  push:
    tags:
      - "protocol/*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write        # create the GitHub Release and upload assets
      id-token: write        # Sigstore keyless signing and provenance
      attestations: write    # actions/attest-build-provenance
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse to publish without the verifier and the vectors
        run: |
          missing=0
          if [ ! -f verifier/pyproject.toml ]; then
            echo "::error title=release::verifier/pyproject.toml is absent. The verifier (M0 archive) must be in the repository before a protocol release. Nothing was published."
            missing=1
          fi
          if ! find vectors -type f ! -name README.md ! -name index.json | grep -q .; then
            echo "::error title=release::vectors/ has no conformity vectors. A release names its vectors (governance-v1.md, section 3.3). Nothing was published."
            missing=1
          fi
          if ! grep -q "^## " CHANGELOG.md; then
            echo "::error title=release::CHANGELOG.md has no release section. Nothing was published."
            missing=1
          fi
          exit $missing

      - name: Record the tag's signature status (informational)
        run: |
          git tag -v "${GITHUB_REF_NAME}" 2>&1 | sed 's/^/tag -v: /' || true
          echo "::notice title=tag signature::The tag's signature is enforced on push by the org ruleset tags-protocol. The output above is informational only; the runner has no trusted keys."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python3 -m pip install --disable-pip-version-check --quiet build==1.6.1 cyclonedx-bom==7.5.0

      - name: Check vectors/index.json (SHA-256 of every vector file; the index the generator wrote)
        run: |
          mkdir -p dist
          python3 -I tools/vectors_index.py --check
          cp vectors/index.json dist/vectors-index.json
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2026-01-01 00:00Z' -czf dist/vectors.tar.gz vectors
          sha256sum dist/vectors.tar.gz

      - name: Build the verifier (sdist and wheel)
        run: python3 -m build --sdist --wheel --outdir dist verifier

      - name: Build the SBOM (CycloneDX)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet ./verifier
          python3 -m cyclonedx_py environment --output-format JSON --output-file dist/verifier.sbom.cdx.json
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every artifact (Sigstore keyless; the signer is this workflow's OIDC identity)
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in *; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --bundle "$f.sigstore.json" "$f"
          done
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/vectors-index.json
            dist/verifier.sbom.cdx.json

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Draft. Published by the founder under interim governance (governance-v1.md, section 8)."
            echo
            echo "Protocol release \`$TAG\`. Status: draft. No organism is running. Stable cannot be declared during interim governance."
            echo
            echo "Documents: see manifest.md at this tag. Conformity vectors: vectors/index.json (SHA-256 of every vector). Verifier: the sdist and wheel attached."
            echo
            echo "Every attached file is signed with Sigstore (cosign keyless; \`.sigstore.json\` bundles) and covered by a build provenance attestation. Verify with:"
            echo
            echo '```'
            echo "cosign verify-blob --bundle <file>.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/ilorium-protocol/protocol/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>"
            echo "gh attestation verify <file> --repo ilorium-protocol/protocol"
            echo '```'
            echo
            echo "Changelog: CHANGELOG.md at this tag."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create the GitHub Release (prerelease)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG (draft)" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            --verify-tag \
            dist/*.whl dist/*.tar.gz dist/vectors-index.json dist/verifier.sbom.cdx.json dist/SHA256SUMS dist/*.sigstore.json
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
